[package]
name = "aevra-desktop-helper"
version = "0.1.0"
edition = "2021"
publish = false
description = "Windows desktop-control helper: stdio JSON-RPC protocol loop, window identity, accessibility tree, and input synthesis."

[[bin]]
name = "aevra-desktop-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
# Pure-Rust, dependency-free JPEG encoder. See helper/src/capture.rs for why
# capture returns JPEG rather than PNG.
jpeg-encoder = "0.6.1"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
xa11y = { version = "=0.15.0", default-features = false }
sysinfo = { version = "=0.37.2", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  # PrintWindow and PRINT_WINDOW_FLAGS live under Storage::Xps in the
  # windows crate's generated modules, not under UI::WindowsAndMessaging.
  "Win32_Storage_Xps",
  "Win32_Security",
  "Win32_System_StationsAndDesktops",
] }
