name: Security PR1 immutable approval

on:
  pull_request:
    branches: [main]

concurrency:
  group: security-pr1-immutable-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  immutable-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compile focused graph
        shell: bash
        run: |
          cat > tsconfig.security-focused.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "outDir": ".security-test-dist",
              "noEmit": false,
              "noCheck": true
            },
            "include": ["apps/core/test/approval-service.unit.test.ts"]
          }
          EOF
          npx tsc -p tsconfig.security-focused.json
      - run: node --test --test-name-pattern="immutable security approvals" .security-test-dist/apps/core/test/approval-service.unit.test.js
