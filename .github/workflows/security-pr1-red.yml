name: Security PR1 immutable approval

on:
  pull_request:
    branches: [main]

concurrency:
  group: security-pr1-immutable-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  immutable-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types --experimental-transform-types --loader ./scripts/ts-loader.mjs --test --test-name-pattern="immutable security approvals" apps/core/test/approval-service.unit.test.ts
