name: Security PR1 RED

on:
  pull_request:
    branches: [main]

concurrency:
  group: security-pr1-red-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run focused guard check
        shell: bash
        run: |
          set +e
          : > guard-verification.log
          npm ci >> guard-verification.log 2>&1
          install_status=$?
          echo "INSTALL_EXIT=$install_status" >> guard-verification.log
          if [ "$install_status" -eq 0 ]; then
            npx tsc -p tsconfig.json --noCheck --noEmit false --outDir .test-dist >> guard-verification.log 2>&1
            compile_status=$?
            echo "COMPILE_EXIT=$compile_status" >> guard-verification.log
            if [ "$compile_status" -eq 0 ]; then
              node --test .test-dist/apps/core/test/security-guard.unit.test.js >> guard-verification.log 2>&1
              test_status=$?
            else
              test_status=99
            fi
            echo "TEST_EXIT=$test_status" >> guard-verification.log
          else
            echo "COMPILE_EXIT=99" >> guard-verification.log
            echo "TEST_EXIT=99" >> guard-verification.log
          fi
          cat guard-verification.log
      - uses: actions/upload-artifact@v4
        with:
          name: guard-verification
          path: guard-verification.log
