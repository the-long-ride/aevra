name: Security PR1 source snapshot

on:
  pull_request:
    branches: [main]

concurrency:
  group: security-pr1-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: security-pr1-source-${{ github.sha }}
          path: |
            .
            !node_modules
            !.git
          include-hidden-files: true
          retention-days: 1
