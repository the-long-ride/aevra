name: Final branch gate

on:
  push:
    branches:
      - feat/mcp-long-running-processes-permissions-switches

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  cancel-superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel every other queued or running workflow on this branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPOSITORY/actions/runs?branch=$BRANCH&per_page=100" \
            --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress") | .id' \
            | while read -r run_id; do
                [ -z "$run_id" ] && continue
                [ "$run_id" = "$CURRENT_RUN_ID" ] && continue
                gh api --method POST "repos/$REPOSITORY/actions/runs/$run_id/cancel" || true
              done

  verify:
    needs: cancel-superseded
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build

  finalize-success:
    needs: verify
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove temporary verification files
        shell: bash
        run: |
          rm -f .github/workflows/branch-verification.yml
          rm -f .github/workflows/branch-verification-report.yml
          rm -f .github/workflows/cancel-stale-branch-runs.yml
          rm -f .github/workflows/final-branch-gate.yml
          rm -f .verification/branch-ci.json
          rmdir .verification 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci: remove temporary branch verification [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Mark pull request ready
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          pr="$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$pr" ]; then
            gh pr ready "$pr" --repo "$REPOSITORY" || true
            gh pr comment "$pr" --repo "$REPOSITORY" --body "Full branch verification passed on Linux and Windows: format, lint, typecheck, test, coverage, and build. Temporary CI files were removed from the PR branch."
          fi

  report-failure:
    needs: verify
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Keep PR draft and report failed gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr="$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$REPOSITORY" --body "Branch verification failed. The PR remains draft. Run: $RUN_URL"
          fi
