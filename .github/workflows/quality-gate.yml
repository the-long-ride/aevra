name: Quality gate

# Pull requests run only the jobs their changed files need (scripts/ci-changes.mjs).
# Pushes to main run every job: the release downloads the helper and extension
# artifacts from that push run, so it must always be complete.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.areas.outputs.node }}
      web: ${{ steps.areas.outputs.web }}
      extension: ${{ steps.areas.outputs.extension }}
      helper: ${{ steps.areas.outputs.helper }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-changes.mjs

  static-checks:
    name: Static and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:scripts

  node-coverage:
    name: Node coverage (85%)
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pre-pull sandbox image
        run: docker pull node:22-alpine
      - name: Install Podman when the runner lacks it
        run: command -v podman || (sudo apt-get update -qq && sudo apt-get install -y -qq podman)
      - run: npm run test:coverage:node

  web-coverage:
    name: Web coverage (85%)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage:web

  extension:
    name: Extension coverage (85%) and package
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:extension
      # The archive is plain compiled JavaScript, so this artifact is also how a
      # reviewer loads the branch's extension without building it themselves.
      - run: npm run build:extension
      - uses: actions/upload-artifact@v7
        with:
          name: aevra-extension
          path: apps/extension/build/aevra-extension.zip
          if-no-files-found: error

  browser-parity:
    name: Build and browser parity
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npm run test:ui-parity:only

  portability:
    name: Portability (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Each OS keeps browsers in a different default folder; only one exists per runner.
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run test:portability

  desktop-helper:
    name: Desktop helper (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.helper == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux accessibility build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper
      - run: cargo build --locked --release
      # Same profile as the build above, so the tests reuse its compiled crates.
      - run: cargo test --locked --release
      - id: package
        name: Stage native helper artifact
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const slug = process.platform + '-' + process.arch;
          const binary = 'aevra-desktop-helper' + (process.platform === 'win32' ? '.exe' : '');
          const source = path.join('target', 'release', binary);
          const destination = path.join('artifact', slug);
          fs.mkdirSync(destination, { recursive: true });
          fs.copyFileSync(source, path.join(destination, binary));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'slug=' + slug + '\n');
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-helper-${{ steps.package.outputs.slug }}
          path: helper/artifact/${{ steps.package.outputs.slug }}/
          if-no-files-found: error

  # One stable check for branch protection. Jobs skipped because their area did
  # not change pass; a failed or cancelled job fails this one.
  gate:
    name: Quality gate result
    if: always()
    needs:
      - changes
      - static-checks
      - node-coverage
      - web-coverage
      - extension
      - browser-parity
      - portability
      - desktop-helper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then exit 1; fi
          done
