name: CI
on: [push, pull_request]

jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run test:integration
      - run: npm run test:security
      - run: npm run test:web
      - run: npm run build
      - run: npm pack --dry-run
      - name: Validate Unix installers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n installers/linux/install.sh
          bash -n installers/macos/install.sh
      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\installers\windows\install.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

  docker-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: docker version
      - run: npm run build
      - run: node scripts/test.mjs contract
      - run: node --test .test-dist/packages/executor/test/docker.integration.test.js

  fault-injection:
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run test:integration
