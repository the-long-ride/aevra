name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific git tag to release (e.g. v0.1.0; defaults to current ref)'
        required: false
        type: string

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag || '' }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Verify exact commit passed quality gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "Release SHA: $RELEASE_SHA"
          SUCCESSFUL_RUNS="$(
            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/quality-gate.yml/runs" \
              -f head_sha="$RELEASE_SHA" \
              -f status=completed \
              -f per_page=100 \
              --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "push")] | length'
          )"
          if [ "$SUCCESSFUL_RUNS" -lt 1 ]; then
            echo "::error::Release commit $RELEASE_SHA has no successful push-triggered Quality gate run."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Publish to npm (Trusted Publishing / Provenance)
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com --access public
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_SHA="$(git rev-parse HEAD)"
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
          fi
          echo "Creating GitHub Release for $TAG at $RELEASE_SHA"
          node scripts/release-notes.mjs "$TAG" release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating release notes..."
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --target "$RELEASE_SHA" --title "$TAG" --notes-file release-notes.md
          fi
