name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific git tag to release (e.g. v0.1.0; defaults to current ref)'
        required: false
        type: string

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag || '' }}
  cancel-in-progress: false

jobs:
  wait-for-quality-gate:
    name: Wait for Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 130
    outputs:
      run-id: ${{ steps.wait.outputs.run-id }}
      release-sha: ${{ steps.wait.outputs.release-sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Wait for exact commit to pass quality gate
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "Release SHA: $RELEASE_SHA"
          echo "release-sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Waiting for Quality gate CI on this exact commit. Code review approval is not checked."

          WAIT_SECONDS=7200
          DEADLINE=$((SECONDS + WAIT_SECONDS))
          while (( SECONDS < DEADLINE )); do
            RUNS="$(
              gh api \
                --method GET \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/quality-gate.yml/runs" \
                -f head_sha="$RELEASE_SHA" \
                -f per_page=100
            )"
            RUN="$(jq -c '[.workflow_runs[] | select(.event == "push")] | sort_by([.run_number, (.run_attempt // 0)]) | last // empty' <<< "$RUNS")"

            if [[ -z "$RUN" ]]; then
              echo "No Quality gate run exists for $RELEASE_SHA yet; checking again in 30 seconds."
            else
              RUN_ID="$(jq -r '.id' <<< "$RUN")"
              STATUS="$(jq -r '.status' <<< "$RUN")"
              CONCLUSION="$(jq -r '.conclusion // ""' <<< "$RUN")"
              echo "Quality gate run $RUN_ID status: $STATUS${CONCLUSION:+ ($CONCLUSION)}"

              if [[ "$STATUS" == "completed" ]]; then
                if [[ "$CONCLUSION" != "success" ]]; then
                  echo "::error::Quality gate run $RUN_ID completed with conclusion '$CONCLUSION'."
                  exit 1
                fi
                echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
                echo "Quality gate passed for $RELEASE_SHA."
                exit 0
              fi
            fi

            sleep 30
          done

          echo "::error::Timed out after $((WAIT_SECONDS / 60)) minutes waiting for Quality gate CI on $RELEASE_SHA."
          exit 1

  publish:
    name: Publish to npm
    needs: wait-for-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.wait-for-quality-gate.outputs.release-sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download validated native desktop helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ needs.wait-for-quality-gate.outputs.run-id }}"
          echo "Taking native helpers from quality-gate run $RUN_ID"
          gh run download "$RUN_ID" --pattern 'desktop-helper-*' --dir helper-artifacts
          node scripts/stage-desktop-helpers.mjs helper-artifacts dist/helper desktop-helper-release-assets
          test -d dist/helper

      - name: Publish to npm (Trusted Publishing / Provenance)
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com --access public
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_SHA="$(git rev-parse HEAD)"
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
          fi
          echo "Creating GitHub Release for $TAG at $RELEASE_SHA"
          node scripts/release-notes.mjs "$TAG" release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating release notes..."
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --target "$RELEASE_SHA" --title "$TAG" --notes-file release-notes.md
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      # Taken from the quality-gate run that already passed at this exact SHA
      # rather than rebuilt here. A release must ship the artifact CI validated,
      # not a second build of the same commit that nothing checked.
      - name: Download the extension the quality gate built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ needs.wait-for-quality-gate.outputs.run-id }}"
          echo "Taking the extension from quality-gate run $RUN_ID"
          gh run download "$RUN_ID" --name aevra-extension --dir extension-artifact
          test -f extension-artifact/aevra-extension.zip

      # `aevra extension install` asks for exactly this asset name at the running
      # version's tag, so the name and the tag are a contract with the CLI.
      - name: Attach validated control artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            extension-artifact/aevra-extension.zip \
            desktop-helper-release-assets/* \
            --clobber
